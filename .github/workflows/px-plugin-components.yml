name: Strinova plugin components
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugins:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
      RUST_VERSION: '1.99.1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout private Strinova host patch
        uses: actions/checkout@v6
        with:
          repository: MelodyAstro/Strinova
          ref: main
          token: ${{ secrets.STRINOVA_PRIVATE_TOKEN }}
          path: .strinova-patch
          persist-credentials: false
      - name: Apply private Strinova host patch
        run: python3 .strinova-patch/scripts/apply-patch.py --source "$GITHUB_WORKSPACE"
      - name: Checkout private vendor patch
        uses: actions/checkout@v6
        with:
          repository: MelodyAstro/Strinova
          ref: private/vendor-plugins
          token: ${{ secrets.STRINOVA_PRIVATE_TOKEN }}
          path: .strinova-vendor-patch
          persist-credentials: false
      - name: Apply private vendor patch
        run: python3 .strinova-vendor-patch/scripts/apply-patch.py --source "$GITHUB_WORKSPACE" --vendor
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.99.1'
          target: wasm32-wasip2
          cache: false
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-patch-crate
          key: patch-crate-0.1.13-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: strinova-platform-workspace-v076
          cache-all-crates: 'true'
          cache-targets: 'false'
          cache-bin: 'false'
      - uses: go-task/setup-task@v2
        with:
          version: '3.52.0'
      - run: task prepare:crates
      - name: Test request policies and identity parsing
        run: cargo test --locked --release -p strinova-model-mapping -p stravia-vendor-sdk -p stravia-vendor-common --lib
      - name: Build independently installable components
        run: cargo build --locked --release --lib --target wasm32-wasip2 -p strinova-model-mapping -p stravia-vendor-codex -p stravia-vendor-claudecode -p stravia-vendor-antigravity
      - name: Verify unsaved Codex OAuth and credential import
        run: STRAVIA_CODEX_WASM="$PWD/target/wasm32-wasip2/release/stravia_vendor_codex.wasm" STRAVIA_ANTIGRAVITY_WASM="$PWD/target/wasm32-wasip2/release/stravia_vendor_antigravity.wasm" cargo test --locked --release -p stravia-vendor-claudecode --test contract credential_import -- --ignored
      - name: Checksum components
        run: |
          mkdir plugins
          cp target/wasm32-wasip2/release/{strinova_model_mapping,stravia_vendor_codex,stravia_vendor_claudecode,stravia_vendor_antigravity}.wasm plugins/
          (cd plugins && sha256sum *.wasm > SHA256SUMS)
          tar -C plugins -cf - . | gpg --batch --compress-algo none --encrypt \
            --recipient-file .github/strinova-artifact-recipient.asc --output plugins.tar.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: strinova-plugins-${{ github.sha }}
          path: plugins.tar.gpg
          retention-days: 30
